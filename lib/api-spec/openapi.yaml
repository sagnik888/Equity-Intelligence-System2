        preview_quantity: { type: ["integer", "null"] }
        preview_method: { type: string }
        quantity_by_risk: { type: ["integer", "null"] }
        quantity_by_liquidity: { type: ["integer", "null"] }
        quantity_by_company_cap: { type: ["integer", "null"] }
        quantity_by_sector_cap: { type: ["integer", "null"] }
        binding_constraint:
          type: ["string", "null"]
          enum: [risk, liquidity, company_cap, sector_cap, horizon_cap, event_cap]
        position_value: { type: number }
        preview_position_value: { type: ["number", "null"] }
        portfolio_weight_pct: { type: number }
        risk_amount: { type: number }
        median_daily_traded_value_cr: { type: ["number", "null"] }
        estimated_exit_days: { type: ["number", "null"] }

    PaperOrderIntentInput:
      type: object
      required: [isin, side, quantity, idempotency_key]
      properties:
        isin: { type: string }
        side:
          type: string
          enum: [buy, sell]
        order_type:
          type: string
          enum: [market, limit]
          default: limit
        quantity: { type: integer, minimum: 1 }
        limit_price: { type: ["number", "null"] }
        idempotency_key: { type: string }
        rationale: { type: ["string", "null"] }

    PaperOrderIntentResponse:
      type: object
      required: [id, status, execution_mode, live_execution_enabled]
      properties:
        id: { type: integer }
        status: { type: string }
        execution_mode: { type: string, enum: [paper_only] }
        live_execution_enabled: { type: boolean }
        duplicate: { type: boolean }

    PaperOrderIntent:
      type: object
      required: [id, idempotency_key, isin, ticker, side, order_type, quantity, status, created_at, updated_at]
      properties:
        id: { type: integer }
        idempotency_key: { type: string }
        isin: { type: string }
        ticker: { type: string }
        side: { type: string, enum: [buy, sell] }
        order_type: { type: string, enum: [market, limit] }
        quantity: { type: integer }
        limit_price: { type: ["number", "null"] }
        status: { type: string }
        rationale: { type: ["string", "null"] }
        created_by: { type: string }
        approved_by: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PaperOrderIntentList:
      type: object
      required: [items, total, execution_mode, live_execution_enabled]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PaperOrderIntent" }
        total: { type: integer }
        execution_mode: { type: string, enum: [research_only, alert_only, paper_trading] }
        live_execution_enabled: { type: boolean }

    ExecutionBlockedResponse:
      type: object
      required: [error, execution_mode, blocked_reasons]
      properties:
        error: { type: string }
        execution_mode: { type: string, enum: [research_only, alert_only, paper_trading] }
        blocked_reasons:
          type: array
          items: { type: string }

    # ─── Research ─────────────────────────────────────────────────────────────
    ResearchScore:
      type: object
      required: [isin, ticker, name, sector, research_score, confidence, coverage_tier, score_date]
      properties:
        isin: { type: string }
        ticker: { type: string }
        name: { type: string }
        sector: { type: string }
        research_score: { type: number }
        adjusted_research_score: { type: number }
        confidence: { type: number }
        coverage_tier:
          type: string
          enum: [full, standard, limited, screening_only]
        business_quality_score: { type: ["number", "null"] }
        integrity_governance_score: { type: ["number", "null"] }
        valuation_score: { type: ["number", "null"] }
        score_date: { type: string, format: date }

    ResearchScoreList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ResearchScore" }
        total: { type: integer }

    ResearchDetail:
      type: object
      required: [isin, ticker, name, research_score, components, score_date]
      properties:
        isin: { type: string }
        ticker: { type: string }
        name: { type: string }
        sector: { type: string }
        research_score: { type: number }
        adjusted_research_score: { type: number }
        confidence: { type: number }
        components:
          type: array
          items:
            type: object
            required: [name, weight, score]
            properties:
              name: { type: string }
              weight: { type: number }
              score: { type: ["number", "null"] }
              notes: { type: string }
        valuation:
          type: object
          properties:
            method: { type: string }
            fair_value_base: { type: ["number", "null"] }
            fair_value_bull: { type: ["number", "null"] }
            fair_value_bear: { type: ["number", "null"] }
            weighted_fair_value: { type: ["number", "null"] }
            expected_annual_return_pct: { type: ["number", "null"] }
            horizon_years: { type: ["number", "null"] }
            current_price: { type: ["number", "null"] }
        analyst_notes: { type: string }
        score_date: { type: string, format: date }

    EvidenceEntry:
      type: object
      required: [claim_id, claim, claim_type, source, confidence, review_status]
      properties:
        claim_id: { type: string }
        claim: { type: string }
        claim_type:
          type: string
          enum: [fundamental, technical, qualitative, governance, macro, sector, management, regulatory]
        source: { type: string }
        source_grade:
          type: string
          enum: [primary, secondary, inferred, ai_inference]
        document_id: { type: ["string", "null"] }
        page_or_section: { type: ["string", "null"] }
        filing_timestamp: { type: ["string", "null"] }
        supporting_evidence: { type: string }
        contradictory_evidence: { type: string }
        analyst_inference: { type: boolean }
        ai_inference: { type: boolean }
        confidence: { type: number }
        review_status:
          type: string
          enum: [confirmed, pending, contradicted, stale, superseded]
        affected_score: { type: ["string", "null"] }
        created_at: { type: string }

    EvidenceLedger:
      type: object
      required: [isin, ticker, entries, total]
      properties:
        isin: { type: string }
        ticker: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/EvidenceEntry" }
        total: { type: integer }

    # ─── Watchlists ───────────────────────────────────────────────────────────
    WatchlistSummaryItem:
      type: object
      required: [name, display_name, count, description]
      properties:
        name: { type: string }
        display_name: { type: string }
        count: { type: integer }
        description: { type: string }
        category:
          type: string
          enum: [opportunity, risk, monitor, action_required]

    WatchlistSummary:
      type: object
      required: [watchlists]
      properties:
        watchlists:
          type: array
          items: { $ref: "#/components/schemas/WatchlistSummaryItem" }

    WatchlistDetail:
      type: object
      required: [name, display_name, items, total]
      properties:
        name: { type: string }
        display_name: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/CandidateScore" }
        total: { type: integer }

    # ─── Backtest ─────────────────────────────────────────────────────────────
    BacktestResultSummary:
      type: object
      required: [id, name, test_type, status, cagr_pct, sharpe_ratio, max_drawdown_pct, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        test_type:
          type: string
          enum: [candidate_score, daily_signal, weekly_signal, monthly_signal, factor, portfolio_optimization]
        status:
          type: string
          enum: [completed, running, failed]
        period_from: { type: string, format: date }
        period_to: { type: string, format: date }
        cagr_pct: { type: number }
        sharpe_ratio: { type: number }
        sortino_ratio: { type: ["number", "null"] }
        max_drawdown_pct: { type: number }
        hit_rate_pct: { type: ["number", "null"] }
        rank_ic: { type: ["number", "null"] }
        created_at: { type: string }

    BacktestResultList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BacktestResultSummary" }
        total: { type: integer }

    BacktestResult:
      type: object
      required: [id, name, test_type, status, metrics, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        test_type: { type: string }
        status: { type: string }
        period_from: { type: string, format: date }
        period_to: { type: string, format: date }
        metrics:
          $ref: "#/components/schemas/BacktestMetrics"
        equity_curve:
          type: array
          items:
            type: object
            required: [date, value]
            properties:
              date: { type: string }
              value: { type: number }
              benchmark: { type: ["number", "null"] }
        decile_returns:
          type: array
          items:
            type: object
            required: [decile, return_pct]
            properties:
              decile: { type: integer }
              return_pct: { type: number }
        notes: { type: string }
        created_at: { type: string }

    BacktestMetrics:
      type: object
      properties:
        cagr_pct: { type: number }
        excess_return_pct: { type: ["number", "null"] }
        volatility_pct: { type: number }
        max_drawdown_pct: { type: number }
        drawdown_duration_days: { type: ["integer", "null"] }
        sharpe_ratio: { type: number }
        sortino_ratio: { type: ["number", "null"] }
        calmar_ratio: { type: ["number", "null"] }
        information_ratio: { type: ["number", "null"] }
        hit_rate_pct: { type: ["number", "null"] }
        upside_capture_pct: { type: ["number", "null"] }
        downside_capture_pct: { type: ["number", "null"] }
        rank_ic: { type: ["number", "null"] }
        rank_ic_stability: { type: ["number", "null"] }
        decile_spread_pct: { type: ["number", "null"] }
        decile_monotonicity_pct: { type: ["number", "null"] }
        turnover_pct: { type: ["number", "null"] }
        avg_slippage_bps: { type: ["number", "null"] }
        avg_market_impact_bps: { type: ["number", "null"] }
        deflated_sharpe: { type: ["number", "null"] }
        probability_of_overfitting: { type: ["number", "null"] }

    FactorAnalysis:
      type: object
      required: [computed, status, reason, factors]
      properties:
        computed: { type: boolean }
        status: { type: string }
        reason: { type: string }
        factors:
          type: array
          items:
            type: object
            properties:
              factor_name: { type: string }
              ic_mean: { type: number }
              ic_stability: { type: number }
              ic_ir: { type: ["number", "null"] }
              decile_spread_pct: { type: ["number", "null"] }
              sector_exposure: { type: ["number", "null"] }
              size_exposure: { type: ["number", "null"] }
              correlation_with_others:
                type: array
                items:
                  type: object
                  required: [other_factor, correlation]
                  properties:
                    other_factor: { type: string }
                    correlation: { type: number }

    # ─── Dashboard ────────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [universe_snapshot, signal_snapshot, portfolio_snapshot, top_candidates, data_quality]
      properties:
        universe_snapshot:
          type: object
          required: [total_securities, investable, last_updated]
          properties:
            total_securities: { type: integer }
            investable: { type: integer }
            new_listings_30d: { type: integer }
            level1_gates: { type: integer }
            level2_gates: { type: integer }
            last_updated: { type: string }
        signal_snapshot:
          type: object
          required: [daily_strong_buy, daily_buy, daily_accumulate, weekly_strong_buy, monthly_strong_buy]
          properties:
            daily_strong_buy: { type: integer }
            daily_buy: { type: integer }
            daily_accumulate: { type: integer }
            weekly_strong_buy: { type: integer }
            weekly_buy: { type: integer }
            weekly_accumulate: { type: integer }
            monthly_strong_buy: { type: integer }
            monthly_buy: { type: integer }
            monthly_accumulate: { type: integer }
            cross_horizon_confirmed: { type: integer }
        portfolio_snapshot:
          type: object
          properties:
            open_positions: { type: integer }
            paper_positions: { type: integer }
            unrealized_pnl_pct: { type: ["number", "null"] }
            positions_needing_review: { type: integer }
        top_candidates:
          type: array
          items: { $ref: "#/components/schemas/CandidateScore" }
        data_quality:
          type: object
          properties:
            high_confidence_pct: { type: number }
            stale_data_count: { type: integer }
            reconciliation_alerts: { type: integer }
        system_mode:
          type: string
          enum: [research_only, alert_only, paper_trading, manual_confirmation, semi_automatic, automatic]
        configured_system_mode: { type: string }
        score_date: { type: string, format: date }

    Alert:
      type: object
      required: [id, type, severity, title, message, created_at]
      properties:
        id: { type: integer }
        type:
          type: string
          enum: [signal_change, gate_triggered, data_stale, portfolio_review, score_change, hard_gate_level1, reconciliation_error, system]
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        isin: { type: ["string", "null"] }
        ticker: { type: ["string", "null"] }
        title: { type: string }
        message: { type: string }
        is_read: { type: boolean }
        created_at: { type: string }

    AlertList:
      type: object
      required: [items, total, unread_count]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Alert" }
        total: { type: integer }
        unread_count: { type: integer }

    SectorBreakdownItem:
      type: object
      required: [sector, count, avg_candidate_score, strong_buy_count, buy_count, level1_gates]
      properties:
        sector: { type: string }
        count: { type: integer }
        avg_candidate_score: { type: number }
        strong_buy_count: { type: integer }
        buy_count: { type: integer }
        level1_gates: { type: integer }
        avg_data_confidence: { type: number }

    SectorBreakdown:
      type: object
      required: [sectors]
      properties:
        sectors:
          type: array
          items: { $ref: "#/components/schemas/SectorBreakdownItem" }

    RecentChange:
      type: object
      required: [isin, ticker, name, change_type, old_value, new_value, changed_at]
      properties:
        isin: { type: string }
        ticker: { type: string }
        name: { type: string }
        sector: { type: string }
        change_type:
          type: string
          enum: [signal_upgrade, signal_downgrade, score_improvement, score_deterioration, gate_added, gate_removed, data_confidence_change]
        horizon: { type: ["string", "null"] }
        old_value: { type: string }
        new_value: { type: string }
        changed_at: { type: string }

    RecentChangeList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RecentChange" }
        total: { type: integer }

    # ─── Audit ────────────────────────────────────────────────────────────────
    AuditHistory:
      type: object
      required: [isin, ticker, name, as_of_date]
      properties:
        isin: { type: string }
        ticker: { type: string }
        name: { type: string }
        as_of_date: { type: string, format: date }
        universe_status: { type: string }
        data_confidence: { type: ["number", "null"] }
        candidate_score: { type: ["number", "null"] }
        research_score: { type: ["number", "null"] }
        hard_gates:
          type: array
          items: { $ref: "#/components/schemas/HardGateFlag" }
        signals:
          type: array
          items: { $ref: "#/components/schemas/Signal" }
        position:
          type: object
          nullable: true
          properties:
            quantity: { type: integer }
            entry_price: { type: number }
            horizon: { type: string }
        model_version: { type: string }
        formula_version: { type: string }
        decision_explanation: { type: string }
        available_filings:
          type: array
          items:
            type: object
            required: [filing_type, period, source, timestamp]
            properties:
              filing_type: { type: string }
              period: { type: string }
              source: { type: string }
              timestamp: { type: string }
        later_revisions:
          type: array
          items:
            type: object
            required: [date, change_type, description]
            properties:
              date: { type: string }
              change_type: { type: string }
              description: { type: string }
