openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Indian Equity Intelligence System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: universe
    description: Security master and universe management
  - name: scores
    description: Candidate scores and component scores
  - name: rankings
    description: Multi-dimensional ranking system
  - name: hardgates
    description: Hard gate engine (Block/Cap/Penalty)
  - name: signals
    description: Daily/Weekly/Monthly/Medium/Long signals
  - name: portfolio
    description: Portfolio positions and suitability
  - name: research
    description: Deep research scores and evidence ledger
  - name: watchlists
    description: Dynamic watchlist management
  - name: backtest
    description: Backtest results and performance metrics
  - name: dashboard
    description: Dashboard aggregates and summary
  - name: audit
    description: Historical audit reconstruction
  - name: governance
    description: Formula registry, validation state, source rights, resources, and execution controls

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Universe ───────────────────────────────────────────────────────────────
  /universe:
    get:
      operationId: listSecurities
      tags: [universe]
      summary: List securities in the universe
      parameters:
        - name: group
          in: query
          schema:
            type: string
            enum: [large_cap, mid_cap, small_cap, micro_cap, sme, reit_invit, all]
          description: Universe group filter
        - name: sector
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [active, suspended, delisted, all]
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of securities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityList"

  /universe/{isin}:
    get:
      operationId: getSecurity
      tags: [universe]
      summary: Get security detail
      parameters:
        - name: isin
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Security detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /universe/stats:
    get:
      operationId: getUniverseStats
      tags: [universe]
      summary: Universe statistics summary
      responses:
        "200":
          description: Universe statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniverseStats"

  # ─── Scores ─────────────────────────────────────────────────────────────────
  /scores:
    get:
      operationId: listCandidateScores
      tags: [scores]
      summary: List candidate scores with filters
      parameters:
        - name: sector
          in: query
          schema: { type: string }
        - name: group
          in: query
          schema: { type: string }
        - name: minScore
          in: query
          schema: { type: number }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [candidate_score, quality_score, growth_score, value_score, data_confidence]
      responses:
        "200":
          description: List of candidate scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateScoreList"

  /scores/{isin}:
    get:
      operationId: getStockScore
      tags: [scores]
      summary: Full score breakdown for a stock
      parameters:
        - name: isin
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Score breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockScoreDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scores/distribution:
    get:
      operationId: getScoreDistribution
      tags: [scores]
      summary: Score distribution across universe
      responses:
        "200":
          description: Score distribution buckets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreDistribution"

  # ─── Rankings ────────────────────────────────────────────────────────────────
  /rankings:
    get:
      operationId: listRankings
      tags: [rankings]
      summary: Multi-dimensional rankings
      parameters:
        - name: dimension
          in: query
          schema:
            type: string
            enum: [overall, sector, market_cap, quality, growth, value, balance_sheet, capital_allocation, integrity, momentum, liquidity, data_confidence, research, upgrade, downgrade, persistence, capacity]
          description: Ranking dimension
        - name: sector
          in: query
          schema: { type: string }
        - name: group
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Rankings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankingList"

  /rankings/{isin}:
    get:
      operationId: getStockRankings
      tags: [rankings]
      summary: All ranking dimensions for a stock
      parameters:
        - name: isin
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Stock rankings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockRankings"

  # ─── Hard Gates ──────────────────────────────────────────────────────────────
  /hardgates:
    get:
      operationId: listHardGates
      tags: [hardgates]
      summary: List active hard gate flags
      parameters:
        - name: level
          in: query
          schema:
            type: string
            enum: [level1, level2, level3, all]
        - name: sector
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Hard gate list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardGateList"

  /hardgates/{isin}:
    get:
      operationId: getStockHardGates
      tags: [hardgates]
      summary: Hard gate status for a stock
      parameters:
        - name: isin
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Hard gate detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockHardGateDetail"

  /hardgates/summary:
    get:
      operationId: getHardGateSummary
      tags: [hardgates]
      summary: Hard gate summary counts by level and trigger
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardGateSummary"

  # ─── Signals ─────────────────────────────────────────────────────────────────
  /signals:
    get:
      operationId: listSignals
      tags: [signals]
      summary: List signals with filtering
      parameters:
        - name: horizon
          in: query
          schema:
            type: string
            enum: [daily, weekly, monthly, medium, long, all]
        - name: state
          in: query
          schema:
            type: string
            enum: [strong_buy, buy, accumulate, watch, hold, reduce, sell, avoid, pending_review]
        - name: sector
          in: query
          schema: { type: string }
        - name: group
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Signal list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalList"

  /signals/{isin}:
    get:
      operationId: getStockSignals
      tags: [signals]
      summary: All horizon signals for a stock
      parameters:
        - name: isin
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Stock signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockSignals"

  /signals/state-summary:
    get:
      operationId: getSignalStateSummary
      tags: [signals]
      summary: Count of signals by state and horizon
      responses:
        "200":
          description: Signal state summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalStateSummary"

  /signals/top-buys:
    get:
      operationId: getTopBuySignals
      tags: [signals]
      summary: Top strong buy and buy signals across all horizons
      parameters:
        - name: horizon
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Top buy signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalList"

  # ─── Portfolio ────────────────────────────────────────────────────────────────
  /portfolio:
    get:
      operationId: listPortfolioPositions
      tags: [portfolio]
      summary: List current portfolio positions
      responses:
        "200":
          description: Portfolio positions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioList"
    post:
      operationId: addPortfolioPosition
      tags: [portfolio]
      summary: Add a position to the portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioPosition"

  /portfolio/{id}:
    patch:
      operationId: updatePortfolioPosition
      tags: [portfolio]
      summary: Update a portfolio position
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioPosition"
    delete:
      operationId: deletePortfolioPosition
      tags: [portfolio]
      summary: Remove a position
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /portfolio/summary:
    get:
      operationId: getPortfolioSummary
      tags: [portfolio]
      summary: Portfolio summary with P&L and risk metrics
      responses:
        "200":
          description: Portfolio summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSummary"

  /portfolio/suitability:
    get:
      operationId: listSuitabilityScores
      tags: [portfolio]
      summary: Position suitability scores for watchlist candidates
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Suitability scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuitabilityList"

  /portfolio/size:
    post:
      operationId: calculatePositionSize
      tags: [portfolio]
      summary: Calculate risk-constrained position size
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionSizeInput"
      responses:
        "200":
          description: Position size calculation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionSizeResult"

  /portfolio/order-intents:
    get:
      operationId: listPaperOrderIntents
      tags: [portfolio]
      summary: List paper order intents
      responses:
        "200":
          description: Paper order intents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperOrderIntentList"
    post:
      operationId: createPaperOrderIntent
      tags: [portfolio]
      summary: Create a duplicate-safe paper order intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaperOrderIntentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperOrderIntentResponse"
        "200":
          description: Existing intent returned for duplicate idempotency key
        "400":
          description: Invalid order intent
        "409":
          description: Order creation blocked until required controls and paper-trading acceptance pass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionBlockedResponse"

  # ─── Research ─────────────────────────────────────────────────────────────────
  /research:
    get:
      operationId: listResearchScores
      tags: [research]
      summary: List deep research scores
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: minScore
          in: query
          schema: { type: number }
      responses:
        "200":
          description: Research scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchScoreList"

  /research/{isin}:
    get:
      operationId: getResearchDetail
      tags: [research]
      summary: Deep research detail for a stock
      parameters:
        - name: isin
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Research detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchDetail"

  /research/{isin}/evidence:
    get:
      operationId: getEvidenceLedger
      tags: [research]
      summary: Evidence ledger entries for a stock
      parameters:
        - name: isin
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Evidence entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceLedger"

  # ─── Watchlists ───────────────────────────────────────────────────────────────
  /watchlists:
    get:
      operationId: listWatchlists
      tags: [watchlists]
      summary: List all dynamic watchlists with counts
      responses:
        "200":
          description: Watchlist summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistSummary"

  /watchlists/{name}:
    get:
      operationId: getWatchlist
      tags: [watchlists]
      summary: Get securities in a specific watchlist
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum: [elite_candidates, quality_at_reasonable_value, emerging_compounders, earnings_improvers, cashflow_improvers, turnaround_watch, deep_value, value_traps, governance_deterioration, balance_sheet_risk, overvaluation, momentum_confirmation, liquidity_deterioration, new_listings, pending_resolution, insufficient_data, recent_upgrades, recent_downgrades, upcoming_results, portfolio_review_required]
      responses:
        "200":
          description: Watchlist securities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistDetail"

  # ─── Backtest ─────────────────────────────────────────────────────────────────
  /backtest/results:
    get:
      operationId: listBacktestResults
      tags: [backtest]
      summary: List backtest run results
      responses:
        "200":
          description: Backtest results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestResultList"

  /backtest/results/{id}:
    get:
      operationId: getBacktestResult
      tags: [backtest]
      summary: Full backtest result detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Backtest result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestResult"

  /backtest/factor-analysis:
    get:
      operationId: getFactorAnalysis
      tags: [backtest]
      summary: Factor IC, decile spreads, and redundancy metrics
      responses:
        "200":
          description: Factor analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactorAnalysis"

  # ─── Dashboard ────────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Main dashboard summary with key metrics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/alerts:
    get:
      operationId: getDashboardAlerts
      tags: [dashboard]
      summary: Active alerts requiring attention
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertList"

  /dashboard/alerts/{id}/read:
    patch:
      operationId: markDashboardAlertRead
      tags: [dashboard]
      summary: Acknowledge an alert
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Alert acknowledged
          content:
            application/json:
              schema:
                type: object
                required: [id, is_read]
                properties:
                  id: { type: integer }
                  is_read: { type: boolean }

  /dashboard/sector-breakdown:
    get:
      operationId: getSectorBreakdown
      tags: [dashboard]
      summary: Score and signal distribution by sector
      responses:
        "200":
          description: Sector breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectorBreakdown"

  /dashboard/recent-changes:
    get:
      operationId: getRecentChanges
      tags: [dashboard]
      summary: Recent score and signal changes
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Recent changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentChangeList"

  # ─── Audit ────────────────────────────────────────────────────────────────────
  /audit/{isin}/history/{date}:
    get:
      operationId: getAuditHistory
      tags: [audit]
      summary: Historical reconstruction for a stock at a given date
      parameters:
        - name: isin
          in: path
          required: true
          schema: { type: string }
        - name: date
          in: path
          required: true
          schema: { type: string }
          description: Historical date for reconstruction (YYYY-MM-DD)
      responses:
        "200":
          description: Historical audit record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditHistory"

  /governance/formulas:
    get:
      operationId: listFormulaRegistry
      tags: [governance]
      summary: Versioned formula registry with governance metadata
      responses:
        "200":
          description: Formula registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormulaRegistry"

  /governance/status:
    get:
      operationId: getGovernanceStatus
      tags: [governance]
      summary: Data, model, investment, and execution validation status
      responses:
        "200":
          description: Governance status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceStatus"

  /governance/settings:
    get:
      operationId: getGovernanceSettings
      tags: [governance]
      summary: Get persisted deployment and safety settings
      responses:
        "200":
          description: Governance settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernanceSettings" }

  /governance/licenses:
    get:
      operationId: listDataLicenses
      tags: [governance]
      summary: List data-license registrations and permitted-use state
      responses:
        "200":
          description: Data licenses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataLicenseList" }

  /governance/connectors:
    get:
      operationId: listConnectorHealth
      tags: [governance]
      summary: List source adapters and recent request health
      responses:
        "200":
          description: Connector health
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorHealth" }

  /governance/models:
    get:
      operationId: listModelRegistry
      tags: [governance]
      summary: List formula and model registry entries
      responses:
        "200":
          description: Model registry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelRegistryList" }

  /governance/features:
    get:
      operationId: listFeatureDefinitions
      tags: [governance]
      summary: List versioned feature definitions
      responses:
        "200":
          description: Feature definitions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureDefinitionList" }

  /governance/gates:
    get:
      operationId: listAcceptanceGates
      tags: [governance]
      summary: List release and safety acceptance gates
      responses:
        "200":
          description: Acceptance gates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptanceGateList" }

  /governance/resources:
    get:
      operationId: getResourceState
      tags: [governance]
      summary: Get latest resource governor state and history
      responses:
        "200":
          description: Resource state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceState" }

  /governance/jobs:
    get:
      operationId: listGovernanceJobs
      tags: [governance]
      summary: List scheduled and running system jobs
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobList" }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    FormulaRegistry:
      type: object
      required: [registry_version, formulas, generated_at]
      properties:
        registry_version: { type: string }
        generated_at: { type: string, format: date-time }
        formulas:
          type: array
          items:
            type: object
            required: [id, version, name, expression, variables, units, validRange, missingValueRule, zeroDivisionRule, testStatus, owner, approvalStatus]
            properties:
              id: { type: string }
              version: { type: string }
              name: { type: string }
              expression: { type: string }
              machineExpression: { type: object, additionalProperties: true }
              variables:
                type: array
                items: { type: string }
              units: { type: string }
              validRange: { type: string }
              missingValueRule: { type: string }
              zeroDivisionRule: { type: string }
              testStatus: { type: string }
              owner: { type: string }
              approvalStatus: { type: string }

    GovernanceStatus:
      type: object
      required: [system_mode, configured_system_mode, effective_execution_mode, deployment_profile, live_execution_enabled, configured_live_execution_enabled, kill_switch_enabled, dataset_status, coverage, validation, entry_safety, foundations, release_readiness, generated_at]
      properties:
        system_mode: { type: string }
        configured_system_mode: { type: string }
        effective_execution_mode: { type: string }
        deployment_profile: { type: string }
        live_execution_enabled: { type: boolean }
        configured_live_execution_enabled: { type: boolean }
        kill_switch_enabled: { type: boolean }
        dataset_status: { type: string }
        coverage:
          type: object
          required: [current, target, coverage_pct]
          properties:
            current: { type: integer }
            target: { type: integer }
            coverage_pct: { type: number }
        validation:
          type: object
          required: [architecture, data, code, model, investment, execution]
          properties:
            architecture: { type: string }
            data: { type: string }
            code: { type: string }
            model: { type: string }
            investment: { type: string }
            execution: { type: string }
        entry_safety:
          type: object
          required: [allow_new_entries, resource_mode, resource_health_review_required, reason]
          properties:
            allow_new_entries: { type: boolean }
            resource_mode: { type: string }
            resource_health_review_required: { type: boolean }
            reason: { type: string }
        foundations:
          type: object
          required: [licensed_sources_registered, source_adapters_registered, point_in_time_facts, corporate_actions, acceptance_gates_registered]
          properties:
            licensed_sources_registered: { type: boolean }
            source_adapters_registered: { type: boolean }
            point_in_time_facts: { type: boolean }
            corporate_actions: { type: boolean }
            acceptance_gates_registered: { type: boolean }
        release_readiness:
          type: object
